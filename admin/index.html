<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo Dodge</title>
<style>
  :root{
    --bg:#161022; --bg2:#1F1733; --present:#F2A65A; --echo:#8B6BF2; --ink:#F3EFEA; --ink-soft:#9A8FB8; --line:#2C2244;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    touch-action:none;
  }
  #wrap{position:relative; width:min(94vw,520px); aspect-ratio:9/13; max-height:92vh;}
  canvas{width:100%; height:100%; display:block; border-radius:18px; background:radial-gradient(circle at 50% 18%, var(--bg2), var(--bg)); box-shadow:0 0 0 1px var(--line), 0 24px 60px -24px rgba(139,107,242,.35);}
  #hud{position:absolute; top:16px; left:18px; right:18px; display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); pointer-events:none; letter-spacing:.02em;}
  #hud b{color:var(--present); font-weight:700;}
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:30px; background:rgba(22,16,34,.78); backdrop-filter:blur(6px); border-radius:18px;}
  .overlay h1{font-size:25px; font-weight:700;}
  .overlay h1 span{color:var(--echo);}
  .overlay p{color:var(--ink-soft); font-size:14px; max-width:300px; line-height:1.55;}
  button{
    background:var(--present); color:#231407; border:none; padding:12px 28px; border-radius:999px;
    font-weight:700; font-size:15px; cursor:pointer; letter-spacing:.01em;
  }
  button:active{transform:scale(.97);}
  .hint{font-size:12px; color:var(--ink-soft); opacity:.8;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>Tiempo <b id="timeEl">0.0</b>s</span><span>Récord <b id="bestEl">0.0</b>s</span></div>

  <div class="overlay" id="startOverlay">
    <h1>Echo <span>Dodge</span></h1>
    <p>Mueve tu punto para esquivar lo que cae. Cada pocos segundos aparece un eco: tu propio recorrido de hace unos instantes, repetido como obstáculo. Sobrevive el mayor tiempo posible.</p>
    <button id="startBtn">Jugar</button>
    <div class="hint">Arrastra con el dedo o el mouse</div>
  </div>

  <div class="overlay" id="overOverlay" style="display:none;">
    <h1>Te alcanzó <span>un eco</span></h1>
    <p id="resultText"></p>
    <button id="retryBtn">Otra vez</button>
  </div>
</div>

<script>
(function(){
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  const wrap=document.getElementById('wrap');
  const timeEl=document.getElementById('timeEl');
  const bestEl=document.getElementById('bestEl');
  const startOverlay=document.getElementById('startOverlay');
  const overOverlay=document.getElementById('overOverlay');
  const resultText=document.getElementById('resultText');

  let W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const rect=wrap.getBoundingClientRect();
    W=rect.width; H=rect.height;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);
  resize();

  let best=0;
  try{ best=parseFloat(localStorage.getItem('echoDodgeBest')||'0'); }catch(e){}
  bestEl.textContent=best.toFixed(1);

  const R=10;
  let player, obstacles, echoes, pathLog, elapsed, lastSpawn, lastEcho, running, pointer, lastT;

  function reset(){
    player={x:W/2,y:H*0.8};
    obstacles=[];
    echoes=[];
    pathLog=[];
    elapsed=0; lastSpawn=0; lastEcho=0;
    pointer=null; lastT=null;
    running=true;
  }

  function spawnObstacle(){
    const w=18+Math.random()*26;
    obstacles.push({x:Math.random()*(W-w)+w/2, y:-20, w, h:16, vy:95+Math.min(elapsed*6,180)+Math.random()*40});
  }

  function spawnEcho(){
    if(pathLog.length<30) return;
    const points=pathLog.slice(-240);
    echoes.push({points, idx:0});
    if(echoes.length>3) echoes.shift();
  }

  function setPointer(x,y){
    const rect=canvas.getBoundingClientRect();
    pointer={x:x-rect.left, y:y-rect.top};
  }
  canvas.addEventListener('pointerdown',e=>{ if(running) setPointer(e.clientX,e.clientY); });
  canvas.addEventListener('pointermove',e=>{ if(running && e.buttons) setPointer(e.clientX,e.clientY); });
  canvas.addEventListener('touchmove',e=>{
    if(running && e.touches[0]){ setPointer(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); }
  },{passive:false});

  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

  function gameOver(){
    running=false;
    if(elapsed>best){
      best=elapsed;
      try{ localStorage.setItem('echoDodgeBest', best.toFixed(2)); }catch(e){}
    }
    bestEl.textContent=best.toFixed(1);
    resultText.textContent=`Sobreviviste ${elapsed.toFixed(1)} segundos. Récord: ${best.toFixed(1)}s.`;
    overOverlay.style.display='flex';
  }

  function loop(t){
    if(lastT===null) lastT=t;
    const dt=Math.min((t-lastT)/1000,0.05);
    lastT=t;
    if(running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    elapsed+=dt;
    timeEl.textContent=elapsed.toFixed(1);

    if(pointer){
      player.x+=(pointer.x-player.x)*Math.min(dt*14,1);
      player.y+=(pointer.y-player.y)*Math.min(dt*14,1);
    }
    player.x=Math.max(R,Math.min(W-R,player.x));
    player.y=Math.max(R,Math.min(H-R,player.y));

    pathLog.push({x:player.x,y:player.y});
    if(pathLog.length>900) pathLog.shift();

    lastSpawn+=dt;
    const interval=Math.max(0.45, 1.1-elapsed*0.02);
    if(lastSpawn>interval){ lastSpawn=0; spawnObstacle(); }

    lastEcho+=dt;
    if(lastEcho>6){ lastEcho=0; spawnEcho(); }

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.y+=o.vy*dt;
      if(o.y-o.h/2>H){ obstacles.splice(i,1); continue; }
      if(player.x>o.x-o.w/2-R*0.6 && player.x<o.x+o.w/2+R*0.6 && player.y>o.y-o.h/2-R*0.6 && player.y<o.y+o.h/2+R*0.6){
        gameOver(); return;
      }
    }

    for(const e of echoes){
      e.idx=Math.min(e.idx+1, e.points.length-1);
      const p=e.points[e.idx];
      if(p && dist(player.x,player.y,p.x,p.y) < R+9){ gameOver(); return; }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    echoes.forEach(e=>{
      const p=e.points[e.idx];
      if(!p) return;
      ctx.save();
      ctx.fillStyle='#8B6BF2';
      ctx.shadowColor='#8B6BF2'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    obstacles.forEach(o=>{
      ctx.globalAlpha=0.92;
      ctx.fillStyle='#F3EFEA';
      ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);
    });
    ctx.globalAlpha=1;

    ctx.save();
    ctx.fillStyle='#F2A65A';
    ctx.shadowColor='#F2A65A'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(player.x,player.y,R,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  document.getElementById('startBtn').addEventListener('click',()=>{
    startOverlay.style.display='none';
    reset();
  });
  document.getElementById('retryBtn').addEventListener('click',()=>{
    overOverlay.style.display='none';
    reset();
  });

  reset();
  running=false;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
