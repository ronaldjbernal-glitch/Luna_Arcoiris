
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Servicio temporalmente no disponible.">

  <title>503 | Servicio no disponible</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'DM Sans', sans-serif;

      color: #514b78;

      background:
        radial-gradient(
          circle at 10% 10%,
          #eadcff 0%,
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          #f8dff0 0%,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f8f6ff,
          #f4f1ff
        );

      overflow: hidden;
    }

    /* DECORACIÓN DE FONDO */

    body::before {
      content: "";

      position: fixed;

      width: 300px;
      height: 300px;

      top: -160px;
      left: -100px;

      border-radius: 50%;

      background: #eadcff80;

      filter: blur(2px);

      pointer-events: none;
    }

    body::after {
      content: "";

      position: fixed;

      width: 350px;
      height: 350px;

      right: -180px;
      bottom: -180px;

      border-radius: 50%;

      background: #e5ddff80;

      pointer-events: none;
    }

    /* CONTENEDOR */

    .container {
      width: 100%;
      max-width: 650px;

      padding: 40px 25px;

      text-align: center;

      position: relative;

      z-index: 2;
    }

    /* ILUSTRACIÓN */

    .illustration {
      width: 170px;
      height: 130px;

      margin: 0 auto 30px;

      position: relative;

      animation: float 4s ease-in-out infinite;
    }

    /* VENTANA DEL NAVEGADOR */

    .browser {
      position: absolute;

      width: 145px;
      height: 105px;

      left: 5px;
      top: 10px;

      border-radius: 18px;

      background: #ffffff;

      border: 3px solid #c5b7eb;

      box-shadow:
        0 15px 35px #aaa0cf35;

      transform: rotate(-7deg);
    }

    .browser-top {
      height: 25px;

      display: flex;
      align-items: center;

      gap: 5px;

      padding-left: 12px;

      background: #c5b7eb;

      border-radius: 14px 14px 0 0;
    }

    .browser-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #fff;
    }

    .sad-face {
      position: absolute;

      left: 50%;
      top: 62%;

      transform: translate(-50%, -50%);

      font-size: 35px;

      color: #6d6595;
    }

    /* TRIÁNGULO DE ADVERTENCIA */

    .warning {
      position: absolute;

      right: 0;
      bottom: 0;

      width: 70px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        145deg,
        #f3a5c4,
        #e985b1
      );

      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );

      filter:
        drop-shadow(
          0 7px 10px #d98aae55
        );

      animation: warningPulse 2s ease-in-out infinite;
    }

    .warning::before {
      content: "!";

      color: white;

      font-size: 32px;

      font-weight: 700;

      margin-top: 13px;
    }

    /* CÓDIGO */

    .error-code {
      font-size: clamp(80px, 15vw, 120px);

      line-height: 1;

      font-weight: 700;

      letter-spacing: -5px;

      color: #62578f;

      margin-bottom: 15px;

      text-shadow:
        0 8px 20px #8f82bd25;
    }

    /* TÍTULO */

    h1 {
      font-size: clamp(22px, 5vw, 32px);

      font-weight: 700;

      color: #514875;

      margin-bottom: 18px;
    }

    /* DESCRIPCIÓN */

    .description {
      max-width: 520px;

      margin: 0 auto;

      color: #817b9e;

      font-size: 16px;

      line-height: 1.8;
    }

    /* BOTÓN */

    .retry {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-top: 30px;

      min-width: 220px;

      padding: 14px 28px;

      border-radius: 35px;

      border: none;

      color: white;

      background:
        linear-gradient(
          135deg,
          #9e8bea,
          #dc88c1
        );

      font-family: inherit;

      font-size: 15px;

      font-weight: 600;

      text-decoration: none;

      cursor: pointer;

      box-shadow:
        0 10px 25px #a58edc45;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .retry:hover {
      transform: translateY(-3px);

      box-shadow:
        0 14px 30px #a58edc60;
    }

    .retry:active {
      transform: translateY(0);
    }

    .retry-icon {
      font-size: 22px;

      line-height: 1;

      transition: transform .5s ease;
    }

    .retry:hover .retry-icon {
      transform: rotate(180deg);
    }

    /* SEPARADOR */

    .divider {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 20px;

      margin: 50px auto 15px;

      max-width: 280px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background:
        linear-gradient(
          to right,
          transparent,
          #d7c9ed
        );
    }

    .divider::after {
      background:
        linear-gradient(
          to left,
          transparent,
          #d7c9ed
        );
    }

    .heart {
      color: #d69bc3;

      font-size: 22px;

      animation: heart 2s ease-in-out infinite;
    }

    /* CRÉDITO */

    .creator {
      color: #958cab;

      font-size: 13px;

      letter-spacing: .2px;
    }

    .creator strong {
      color: #71658f;
      font-weight: 600;
    }

    /* ANIMACIONES */

    @keyframes float {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }

    @keyframes warningPulse {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }

    }

    @keyframes heart {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

    }

    /* MÓVILES */

    @media (max-width: 600px) {

      .container {
        padding: 30px 20px;
      }

      .illustration {
        transform: scale(.9);
        margin-bottom: 20px;
      }

      .error-code {
        font-size: 85px;
      }

      h1 {
        font-size: 24px;
      }

      .description {
        font-size: 14px;
      }

      .retry {
        width: 100%;
        max-width: 250px;
      }

      .divider {
        margin-top: 40px;
      }

    }

    /* REDUCIR ANIMACIONES */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

    }

  </style>
</head>

<body>

  <main class="container">

    <!-- ILUSTRACIÓN DE ERROR -->

    <div class="illustration">

      <div class="browser">

        <div class="browser-top">

          <span class="browser-dot"></span>
          <span class="browser-dot"></span>
          <span class="browser-dot"></span>

        </div>

        <div class="sad-face">
          ☹
        </div>

      </div>

      <div class="warning"></div>

    </div>


    <!-- ERROR -->

    <div class="error-code">
      503
    </div>


    <!-- MENSAJE -->

    <h1>
      Servicio temporalmente no disponible
    </h1>


    <p class="description">
      Estamos trabajando para resolver el problema.
      <br>
      Por favor, intenta nuevamente en unos minutos.
    </p>


    <!-- BOTÓN -->

    <a
      href="javascript:location.reload()"
      class="retry"
    >

      <span class="retry-icon">
        ↻
      </span>

      Volver a intentar

    </a>


    <!-- CRÉDITO -->

    <div class="divider">
      <span class="heart">♡</span>
    </div>

    <div class="creator">
      Diseñado y creado por
      <strong>Jhoan Bernal</strong>
    </div>

  </main>

</body>
</html>
```
